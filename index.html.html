<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشروبات SaudiCo</title>
<style>
:root{--bg:#f1f4f8;--card:#fff;--tx:#16202b;--mut:#667585;--ac:#1f4e79;--act:#fff;--bd:#dbe2ea;--hi:#e8f0f8;--ok:#1f8a4c;--wr:#c26d00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--card:#19222c;--tx:#eaf0f6;--mut:#93a3b3;--ac:#6aa7de;--act:#0b1824;--bd:#2b3745;--hi:#20303f;--ok:#5cc087;--wr:#f0a94a}}
:root[data-theme="dark"]{--bg:#0f151c;--card:#19222c;--tx:#eaf0f6;--mut:#93a3b3;--ac:#6aa7de;--act:#0b1824;--bd:#2b3745;--hi:#20303f;--ok:#5cc087;--wr:#f0a94a}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.5}
.brand{background:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--ac)}
.brand img{height:46px;max-width:70%;object-fit:contain}
.brand span{color:#44505c;font-size:13px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.seg{display:flex;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px;margin:16px 0}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);padding:11px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--act)}
h2{font-size:20px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:14px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.two{grid-template-columns:1fr}}
.drinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.drinks button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}
.drinks button i{font-style:normal;font-size:26px}
.drinks button.on{border-color:var(--ac);background:var(--hi);color:var(--ac)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:11px 16px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--ac);color:var(--act);border-color:var(--ac)}
.btn.big{width:100%;padding:14px;font-size:17px;margin-top:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.s-new{color:var(--wr);border-color:var(--wr)}.s-prep{color:var(--ac);border-color:var(--ac)}.s-done{color:var(--ok);border-color:var(--ok)}
.dept{background:var(--hi);color:var(--ac);border-color:transparent}
.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chips button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;font:inherit;font-size:14px;cursor:pointer}
.chips button.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sum span{background:var(--hi);color:var(--ac);font-weight:600;border-radius:99px;padding:5px 13px;font-size:14px}
.ord{border-inline-start:5px solid var(--wr)}.ord.prep{border-inline-start-color:var(--ac)}
.err{color:var(--wr);margin:10px 0 0}
.msg{padding:14px;border-radius:12px;background:var(--card);border:1px solid var(--bd)}
</style>
</head>

  sugar=document.getElementById("sg").value; note=document.getElementById("nt").value.trim(); var o=document.getElementById("ot"); if(o) other=o.value.trim();
}

function renderOrder(){
  var mine = orders.filter(function(o){return me.name && o.name===me.name}).slice(0,5);
  var h = '<h2>عايز تشرب إيه؟</h2><div class="card">'
   + '<div class="two"><div><label>الاسم</label><input id="nm" value="'+esc(me.name)+'" placeholder="م. أحمد"></div>'
   + '<div><label>القسم</label><select id="dp"><option value="">اختار القسم</option>'+DEPTS.map(function(d){return '<option'+(me.dept===d?' selected':'')+'>'+d+'</option>'}).join("")+'</select></div></div>'
   + '<label>مكانك (رقم المكتب / الدور)</label><input id="dk" value="'+esc(me.desk)+'" placeholder="مثال: مكتب 12 - الدور التاني">'
   + '<label>المشروب</label><div class="drinks">'
   + DRINKS.map(function(d){return '<button data-d="'+d[0]+'" class="'+(sel===d[0]?"on":"")+'"><i>'+d[1]+'</i>'+d[0]+'</button>'}).join("")
   + '</div>'+(sel==="مشروب آخر"?'<label>اكتب المشروب</label><input id="ot" value="'+esc(other)+'" placeholder="مثال: عصير ليمون">':'')+'<div class="two"><div><label>السكر</label><select id="sg">'+SUGAR.map(function(s){return '<option'+(s===sugar?" selected":"")+'>'+s+'</option>'}).join("")+'</select></div>'
   + '<div><label>ملاحظات (اختياري)</label><input id="nt" value="'+esc(note)+'" placeholder="مثال: بدون لبن"></div></div>'
   + (err?'<p class="err">'+esc(err)+'</p>':'')
   + (sent?'<p style="color:var(--ok);font-weight:600;margin:10px 0 0">✓ الطلب اتبعت، هيوصلك على مكتبك.</p>':'')
   + '<button class="btn pri big" id="go">ابعت الطلب</button></div>';
  if(mine.length){
    h += '<div class="mut" style="margin:14px 2px 8px">طلباتك الأخيرة</div>' + mine.map(function(o){
      return '<div class="card row" style="padding:12px 16px"><div><b>'+esc(o.drink)+'</b> <span class="mut">· '+esc(o.sugar)+'</span></div><span class="tag s-'+o.status+'">'+ST[o.status]+'</span></div>';
    }).join("");
  }
  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll("[data-d]"),function(b){
    b.onclick=function(){ keep(); sel=b.getAttribute("data-d"); sent=false; err=""; render(); };
  });
  document.getElementById("go").onclick = send;
}
function send(){
  keep(); sent=false;
  if(!me.name||!me.dept||!me.desk||!sel||(sel==="مشروب آخر"&&!other)){ err="اكتب اسمك واختار القسم واكتب مكانك واختار المشروب."; render(); return; }
  err="";
  try{ localStorage.setItem("sc_me",JSON.stringify(me)); }catch(e){}
  col.add({name:me.name,dept:me.dept,desk:me.desk,drink:(sel==="مشروب آخر"?other:sel),sugar:sugar,note:note,status:"new",createdAt:Date.now()})
    .then(function(){ sel=""; other=""; note=""; sent=true; if(!staffOk) subscribe(); else render(); })
    .catch(function(){ err="حصلت مشكلة في الإرسال، جرّب تاني."; render(); });
}

function renderStaff(){
  if(!staffOk){
    app.innerHTML='<h2>دخول فريق الضيافة</h2><div class="card"><label>البريد الإلكتروني</label><input id="em" type="email" dir="ltr" autocomplete="username"><label>كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="current-password">'
     +(err?'<p class="err">'+esc(err)+'</p>':'')+'<button class="btn pri big" id="lg">دخول</button></div>';
    document.getElementById("lg").onclick=function(){
      auth.signInWithEmailAndPassword(document.getElementById("em").value.trim(),document.getElementById("pw").value)
        .then(function(){err="";})
        .catch(function(){err="البريد أو كلمة السر غلط.";render();});
    };
    return;
  }
  var open = orders.filter(function(o){return o.status!=="done"&&(fdept==="الكل"||o.dept===fdept)}).sort(function(a,b){return a.createdAt-b.createdAt});
  var done = orders.filter(function(o){return o.status==="done"}).slice(0,6);
  var cnt = {}; open.forEach(function(o){cnt[o.drink]=(cnt[o.drink]||0)+1});
  var h = '<h2>الطلبات المطلوبة</h2><div class="chips">'+["الكل"].concat(DEPTS).map(function(d){return '<button data-f="'+d+'" class="'+(fdept===d?"on":"")+'">'+d+'</button>'}).join("")+'</div>';
  h += '<div class="sum">'+(open.length?Object.keys(cnt).map(function(k){return '<span>'+esc(k)+' × '+cnt[k]+'</span>'}).join(""):'<span>مفيش طلبات مفتوحة 🎉</span>')+'</div>';
  h += open.map(function(o){
    return '<div class="card ord '+o.status+'"><div class="row"><b style="font-size:19px">'+esc(o.drink)+'</b><span class="tag s-'+o.status+'">'+ST[o.status]+'</span></div>'
     +'<div style="margin-top:4px">'+esc(o.name)+(o.dept?' <span class="tag dept">'+esc(o.dept)+'</span>':'')+'</div>'
     +'<div>📍 <b>'+esc(o.desk)+'</b></div>'
     +'<div class="mut">'+esc(o.sugar)+(o.note?' · '+esc(o.note):'')+' · '+ago(o.createdAt)+'</div>'
     +'<div class="row" style="margin-top:12px">'
     +(o.status==="new"?'<button class="btn" data-s="prep" data-id="'+o.id+'">ابدأ التحضير</button>':'')
     +'<button class="btn pri" data-s="done" data-id="'+o.id+'">تم التسليم ✓</button></div></div>';
  }).join("");
  if(done.length) h += '<div class="mut" style="margin:14px 2px 6px">آخر ما اتسلّم</div>'+done.map(function(o){return '<div class="mut">✓ '+esc(o.drink)+' — '+esc(o.name)+' ('+esc(o.desk)+')</div>'}).join("");
  var nd=orders.filter(function(o){return o.status==="done"}).length; h += '<div class="row" style="margin-top:14px"><button class="btn" id="sd">'+(soundOn?'🔔 الصوت شغال':'🔕 الصوت مقفول')+'</button>'+(nd?'<button class="btn" id="cl">'+(confirmClear?'تأكيد مسح '+nd+' طلب؟':'🗑 امسح المسلّم ('+nd+')')+'</button>':'')+'<button class="btn" id="lo">خروج</button></div>';
  app.innerHTML = h;
  Array.prototype.forEach.call(app.querySelectorAll("[data-f]"),function(b){ b.onclick=function(){fdept=b.getAttribute("data-f");render()}; });
  Array.prototype.forEach.call(app.querySelectorAll("[data-s]"),function(b){
    b.onclick=function(){ col.doc(b.getAttribute("data-id")).update({status:b.getAttribute("data-s")}); };
  });
  document.getElementById("sd").onclick=function(){soundOn=!soundOn; if(soundOn) beep(); render();};
  var cl=document.getElementById("cl"); if(cl) cl.onclick=function(){ if(!confirmClear){confirmClear=true;render();setTimeout(function(){confirmClear=false;if(tab==="staff"&&!typing())render()},4000);return;} confirmClear=false; orders.filter(function(o){return o.status==="done"}).forEach(function(o){col.doc(o.id).delete()}); };
  document.getElementById("lo").onclick=function(){auth.signOut();};
}

document.getElementById("t-order").onclick=function(){keep();tab="order";err="";render()};
document.getElementById("t-staff").onclick=function(){keep();tab="staff";err="";render()};
render();

function subscribe(){
  if(unsub){unsub();unsub=null;}
  seen=null;
  var q = staffOk ? col : (me.name ? col.where("name","==",me.name) : null);
  if(!q){ orders=[]; render(); return; }
  unsub = q.onSnapshot(function(s){
    orders = s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x}).sort(function(a,b){return b.createdAt-a.createdAt});
    var fresh=false; orders.forEach(function(o){ if(seen && !seen[o.id] && o.status==="new") fresh=true; }); seen={}; orders.forEach(function(o){seen[o.id]=1}); if(fresh && staffOk && soundOn) beep();
    if(!typing()) render();
  }, function(){ app.innerHTML='<div class="msg">تعذّر تحميل الطلبات. راجع قواعد Firestore.</div>'; });
}
try{
  if(FIREBASE_CONFIG.apiKey.indexOf("PASTE")===0){ app.innerHTML='<div class="msg">لازم تلصق إعدادات Firebase في أول ملف الصفحة.</div>'; }
  else {
    firebase.initializeApp(FIREBASE_CONFIG);
    auth = firebase.auth(); col = firebase.firestore().collection("orders");
    auth.onAuthStateChanged(function(u){
      if(!u){ auth.signInAnonymously().catch(function(){ app.innerHTML='<div class="msg">تعذّر الاتصال. تأكد من تفعيل Anonymous في Firebase Authentication.</div>'; }); return; }
      staffOk = !u.isAnonymous; subscribe();
    });
  }
}catch(e){ app.innerHTML='<div class="msg">حصل خطأ في الاتصال.</div>'; }
setInterval(function(){ if(tab==="staff"&&staffOk&&!typing()) render(); },60000);
</script>
</body>
</html>
